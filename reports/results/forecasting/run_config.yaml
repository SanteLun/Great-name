        metric: mae
        learning_rate: 0.03
        num_leaves: 63
        max_depth: -1
        min_child_samples: 20
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0
        n_estimators: 500
        early_stopping_rounds: 50
        random_state: 42
        n_jobs: 4
        deterministic: true
        force_col_wise: true
        verbosity: -1
    catboost:
      enable: true
      params:
        iterations: 500
        learning_rate: 0.05
        depth: 8
        l2_leaf_reg: 3.0
        loss_function: MAE
        random_seed: 42
        thread_count: 4
        verbose: 0
    chronos:
      enable: false
      model_name: amazon/chronos-bolt-tiny
      context_length: 24
      batch_size: 64
  ensemble:
    enable: true
    method: prequential
    min_pairs: 20
    shrinkage: 20.0
    min_models: 2
  metrics:
  - mae
  - rmse
  - mape
  - r2
  selection:
    enable: true
    min_pairs: 20
    min_origins: 2
    warmup_model: pooled_seasonal
  output_dir: outputs/full_panel
  use_log: true
