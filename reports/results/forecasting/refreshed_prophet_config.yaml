config:
  horizons:
  - 1
  - 3
  - 6
  - 12
  validation:
    strategy: expanding
    min_train_by_horizon:
      '12': 12
    min_train_months: 13
    step: 1
    n_splits: 4
    n_splits_by_horizon:
      '1': 0
    seed: 42
  models:
    pooled_seasonal:
      enable: false
      growth_shrinkage: 6.0
      level_window: 3
    short_history:
      enable: false
      trend_penalty: 12.0
      damping: 0.9
    prophet:
      seed: 42
      enable: true
      yearly_seasonality: 4
      weekly_seasonality: false
      daily_seasonality: false
      changepoint_prior_scale: 0.05
      seasonality_prior_scale: 5.0
      interval_width: 0.9
      subsample: 40
      min_train_factor: 1.0
    naive:
      enable: false
      mode: seasonal
    lightgbm:
      enable: false
      quantiles:
        enable: true
        alphas:
        - 0.1
        - 0.5
        - 0.9
      params:
        objective: regression
        metric: mae
        learning_rate: 0.03
        num_leaves: 63
        max_depth: -1
        min_child_samples: 20
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0
        n_estimators: 500
        early_stopping_rounds: 50
        random_state: 42
        n_jobs: 4
        verbosity: -1
    catboost:
      enable: false
      params:
        iterations: 500
        learning_rate: 0.05
        depth: 8
        l2_leaf_reg: 3.0
        loss_function: MAE
        random_seed: 42
        thread_count: 4
        verbose: 0
    chronos:
      enable: false
      model_name: amazon/chronos-bolt-tiny
      context_length: 24
      batch_size: 64
  ensemble:
    enable: true
    method: prequential
    min_pairs: 20
    shrinkage: 20.0
    min_models: 2
  metrics:
  - mae
  - rmse
  - mape
  - r2
  output_dir: outputs/refreshed_prophet
  use_log: true
territories: 80
quick: false
