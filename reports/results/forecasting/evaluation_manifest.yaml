          '12': 12
        min_train_months: 13
        step: 1
        n_splits: 4
        n_splits_by_horizon:
          '1': 0
        seed: 42
      models:
        pooled_seasonal:
          enable: true
          growth_shrinkage: 6.0
          level_window: 3
        short_history:
          enable: true
          trend_penalty: 12.0
          damping: 0.9
        prophet:
          seed: 42
          enable: false
          yearly_seasonality: 4
