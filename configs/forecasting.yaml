# Конфигурация прогнозирования
horizons: [1, 3, 6, 12]        # горизонты в месяцах (по заданию)

validation:
  strategy: expanding          # реализовано расширяющееся окно
  min_train_by_horizon: {"12": 12}
  min_train_months: 13         # минимум истории для обучения
  step: 1                      # шаг walk-forward в месяцах
  n_splits: 4                  # максимум контрольных точек (для воспроизводимости)
  n_splits_by_horizon: {"1": 0} # для мониторинга нужен ежемесячный ряд остатков
  seed: 42

models:
  pooled_seasonal:
    enable: true
    growth_shrinkage: 6.0
    level_window: 3
  short_history:
    enable: true
    trend_penalty: 12.0
    damping: 0.9
  prophet:
    seed: 42
    enable: true               # базовая модель Сбера (обязательное сравнение)
    yearly_seasonality: 4
    weekly_seasonality: false
    daily_seasonality: false
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 5.0
    interval_width: 0.9
    subsample: 40              # для скорости: число серий для Prophet (0 = все)
    min_train_factor: 1.0      # годовой горизонт тоже проверяем; короткая история — ограничение
  naive:
    enable: true               # наивный бейзлайн (last value / seasonal naive)
    mode: seasonal             # last | seasonal
  lightgbm:
    enable: true
    quantiles:                  # доверительные интервалы прогноза (для детекции шоков)
      enable: true
      alphas: [0.1, 0.5, 0.9]
    params:
      objective: regression
      metric: mae
      learning_rate: 0.03
      num_leaves: 63
      max_depth: -1
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      n_estimators: 500
      early_stopping_rounds: 50
      random_state: 42
      n_jobs: 4          # ограничение потоков, чтобы не грузить ВСЕ ядра (было -1)
      deterministic: true
      force_col_wise: true
      verbosity: -1
  catboost:
    enable: true               # глобальная модель с нативными категориальными признаками
    params:
      iterations: 500
      learning_rate: 0.05
      depth: 8
      l2_leaf_reg: 3.0
      loss_function: MAE
      random_seed: 42
      thread_count: 4          # ограничение потоков (не грузим все ядра)
      verbose: 0
      allow_writing_files: false
  chronos:
    enable: false              # включается при наличии torch (см. requirements)
    model_name: amazon/chronos-bolt-tiny
    revision: a0e552de83495b5c28c14c71c374f3e33280b340
    context_length: 24
    batch_size: 64

ensemble:
  enable: true
  method: prequential          # только ошибки с date <= cutoff; среднее в рублях
  min_pairs: 20
  shrinkage: 20.0
  min_models: 2

metrics:
  - mae                       # обязательная метрика (критерий оценивания)
  - rmse
  - mape
  - r2                         # опционально

selection:
  enable: true
  min_pairs: 20
  min_origins: 2
  warmup_model: pooled_seasonal

output_dir: outputs/forecasting
