# Конфигурация обнаружения точек структурных изменений (шоков)
methods:
  cusum:
    enable: true
    threshold_factor: 4.0      # фиксированный порог стандартизированного ряда
    drift: 0.75                # отдельная калибровка seed=10042, ограничение ложных тревог 15%
    cooldown: 3                # минимальный интервал между срабатываниями
  peltt:
    enable: true               # PELT (ruptures)
    model: rbf                 # rbf | l1 | l2 | normal
    pen: 1.5                   # штраф за точку изменения (для коротких рядов)
  binseg:
    enable: true               # Binary Segmentation (ruptures)
    model: rbf
    pen: 2.5
  bocpd:
    enable: true               # Байесовский онлайн-детектор (реализация в src/)
    hazard: 0.02               # выбран на независимом калибровочном наборе
    prior_scale: 1.0           # сила априора о среднем (kappa0)
    threshold_prob: 0.6        # компромисс чувствительности и ложных тревог

residual_based:
  enable: true                 # детекция на остатках прогнозной модели
  model: lightgbm
  detector: bocpd              # лучший онлайн-метод первого синтетического сравнения
  std_window: 6                # окно оценки стандартного отклонения остатков
  zscore_threshold: 2.5        # порог стандартизированного остатка

# Синтетический бенчмарк (нет размеченных шоков в данных)
benchmark:
  n_series: 500
  length: 60
  seed: 42
  shocks:
    - type: level             # сдвиг уровня
      magnitude: [0.5, 2.0]   # в сигмах
    - type: trend             # изменение тренда
      magnitude: [0.1, 0.5]   # наклон в сигмах/шаг
    - type: variance          # рост волатильности
      magnitude: [1.5, 3.0]   # множитель стандартного отклонения
    - type: spike             # разовый всплеск
      magnitude: [2.0, 4.0]
  metrics: [precision, recall, f1, detection_delay, lead_time]

# Реальные события для калибровки (2023-2024)
real_events:
  - date: 2023-07
    label: "повышение ключевой ставки ЦБ (7.5% -> 8.5%)"
  - date: 2023-08
    label: "повышение ключевой ставки до 12%"
  - date: 2023-09
    label: "повышение ключевой ставки до 13%"
  - date: 2023-10
    label: "повышение ключевой ставки до 15%"
  - date: 2023-12
    label: "повышение ключевой ставки до 16%"
  - date: 2024-07
    label: "повышение ключевой ставки до 18%"
  - date: 2024-10
    label: "повышение ключевой ставки до 21%"

output_dir: outputs/changepoint
